version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: bumonitor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bumonitor
      POSTGRES_PASSWORD: bumonitor
      POSTGRES_DB: bumonitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bumonitor -d bumonitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bumonitor-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://bumonitor:bumonitor@db:5432/bumonitor
      DEBUG: "false"
      APP_NAME: "BU Monitor API"
      APP_VERSION: "0.1.0"
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
